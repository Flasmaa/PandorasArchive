<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="logo.ico">
        <link rel="stylesheet" href="styles.css">
        <title>100826</title>
        <style>
        @keyframes giftbox-hover {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        @keyframes giftbox-open-top {
            0% { transform: rotate(0deg); scale: 100%; opacity: 1; }
            10% { scale: 145%; transform: translateX(2.45px); }
            50% { scale: 145%; opacity: 1; transform: translateY(0) translateX(2.45px); }
            80% { scale: 145%; transform: translateY(-100vh) translateX(2.45px) rotate(0deg); }
            100% { scale: 145%; opacity: 0; transform: translateY(-100vh) translateX(2.45px);}
        }
        @keyframes giftbox-open-box {
            0% { transform: rotate(0deg); scale: 100%; opacity: 1; }
            10% { scale: 160%; }
            50% { scale: 160%; opacity: 1; transform: translateY(0); }
            80.5% { scale: 160%; opacity: 0; transform: translateY(0); }
            100% { scale: 160%; opacity: 0; transform: translateY(-100vh); }
        }
        @keyframes giftbox-start {
            0% { transform: translate(-50%, calc(-50% - 100vh)); }
            100% { transform: translate(-50%, -50%); }
        }
        @keyframes main-open {
            0% { opacity: 0; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .giftbox {
            position: fixed;
            top: 50%;
            left: 49%;
            width: 175px;
            height: 175px;
            animation: giftbox-start 1s ease-out forwards;
        }
        .giftbox-inner {
            position: relative;
            width: 175px;
            height: 175px;
        }
        .giftbox img {
            position: absolute;
            width: 175px;
            height: 175px;
        }
        .giftbox:hover .giftbox-inner {
            animation: giftbox-hover 0.1s ease-in-out infinite;
        }
        .giftbox.is-open:hover .giftbox-inner {
            animation: none;
        }
        .giftbox.is-open .top {
            animation: giftbox-open-top 3s ease forwards;
        }
        .giftbox.is-open .box {
            animation: giftbox-open-box 3s ease forwards;
        }
        .main-open {
            animation: main-open 5s forwards;
        }
        </style>
    </head>
    <body>
        <div class="bg-blur-overlay" aria-hidden="true"></div>
        <div class="giftbox" style="z-index: 3;">
            <div class="giftbox-inner">
                <img class="top" src="elements/giftbox100826/top.png" alt="" style="transform: translateX(1px);">
                <img class="box" src="elements/giftbox100826/box.png" alt="">
            </div>
        </div>
        <div id="main" style="opacity: 0;" class="">
            <img src="elements/boquettest.jpg" alt="" style="width: 100%; height: 100%;">
        </div>
        <script>
            document.querySelector('.giftbox').addEventListener('click', function() {
                this.classList.add('is-open');
            });
            document.querySelector('.giftbox').addEventListener('click', function() {
                const box = document.getElementById('main');
                box.classList.add('main-open');
            });
        </script>
    </body>
</html>
