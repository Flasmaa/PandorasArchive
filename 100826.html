<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="logo.ico">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="100826.css">
        <script>
            window.onload = function() {
                var body = document.getElementById('page-body');
                body.style.backgroundImage = "url('bg/bg100826.png')";
                body.style.backgroundSize = "cover";
                body.style.backgroundPosition = 'center -250px';
            };
        </script>
        <style>
            .fixed-back-letter {
                position: fixed !important;
                top: 12px; left: 12px;
                width: 70px; height: 70px;
                z-index: 2147483647 !important;
                display: inline-flex; align-items: center; justify-content: center;
                pointer-events: auto; transition: transform 160ms ease, opacity 160ms ease;
                transform: translateZ(0); will-change: transform, opacity;
            }

            .fixed-back-letter img { width: 100%; height: auto; display: block; pointer-events: none; }
            .fixed-back-letter:hover { transform: translateY(-4px) scale(1.03);}
                @media (max-width: 480px) { .fixed-back-letter { width: 48px; height: 48px; top: 8px; left: 8px; } }
            .flower-item {
                cursor: pointer;
                transition: transform 0.2s ease, filter 0.2s ease;
                user-select: none;
                position: relative;
                pointer-events: auto !important;
                display: block;
                flex-shrink: 0;
            }
            .fl,
            .fl [class^="florwerrow"] {
                pointer-events: none;
            }
            .fl .flower-item {
                pointer-events: auto !important;
            }
            .flowers-locked .flower-item {
                pointer-events: none !important;
            }
            .flower-item:hover {
                transform: scale(1.04);
                filter: brightness(1.04) drop-shadow(0 5px 5px rgba(0, 0, 0, 0.35));
            }
            .flower-item.is-picked {
                pointer-events: none;
                animation: flower-pick 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
                z-index: 30;
            }
            .flower-item.is-letter-open-hidden {
                visibility: hidden;
            }
            @keyframes flower-pick {
                0% { transform: translate(0, 0) rotate(var(--pick-rot, 0deg)) scale(1); opacity: 1; }
                75% { opacity: 1; }
                100% { transform: translate(var(--pick-x), var(--pick-y)) rotate(var(--pick-rot, 0deg)); opacity: 0; }
            }
            .letter-overlay {
                position: fixed !important;
                inset: 0;
                background: rgba(18, 10, 18, 0.481);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.42s ease;
                z-index: 999999;
            }
            .letter-overlay.visible {
                opacity: 1;
                pointer-events: auto;
            }
            .letter-overlay:not(.visible) .letter-back-button {
                visibility: hidden;
                opacity: 0;
                pointer-events: none !important;
            }
            .letter-panel {
                position: relative;
                width: 800px;
                height: 500px;
                background: url(img/100826frame.png) no-repeat center center;
                border: none;
                border-radius: 16px;
                box-shadow: none;
                overflow: visible;
                opacity: 0;
                transform: translate(-225px, 18px) scale(0.97);
                transition: opacity 0.36s ease, transform 0.36s cubic-bezier(0.2, 0.75, 0.3, 1);
                filter: drop-shadow(3px 6px 5px rgba(0, 0, 0, 0.25));
            }
            .letter-overlay.visible .letter-panel {
                opacity: 1;
                transform: translate(-220px, 0) scale(1);
            }
            .letter-flower-preview {
                position: absolute;
                right: -35px;
                bottom: -30px;
                width: 165px;
                height: 225px;
                object-fit: contain;
                transform: translate(22px, 22px) rotate(18deg) scale(0.72);
                transform-origin: bottom center;
                z-index: 2;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.34s ease, transform 0.42s cubic-bezier(0.2, 0.75, 0.3, 1);
                filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.25));
            }
            .letter-overlay.visible .letter-flower-preview {
                opacity: 1;
                transform: translate(0, 0) rotate(18deg) scale(1);
            }
            .letter-bg {
                width: 100%;
                height: 100%;
                background: #fffaf300;
                border: none;
                border-radius: 16px;
                box-shadow: none;
                overflow: hidden;
            }
            .letter-back-button {
                position: fixed !important;
                top: 12px; left: 12px;
                width: 70px; height: 70px;
                z-index: 2147483647 !important;
                display: inline-flex; align-items: center; justify-content: center;
                pointer-events: auto; transition: transform 160ms ease, opacity 160ms ease;
                transform: translateZ(0); will-change: transform, opacity;
                border: none;
                background: transparent;
                padding: 0;
                cursor: pointer;
            }
            .letter-back-button img { width: 100%; height: auto; display: block; pointer-events: none; }
            .letter-back-button:hover { transform: translateY(-4px) scale(1.03); }
            @media (max-width: 480px) { .letter-back-button { width: 48px; height: 48px; top: 200px; left: 300px; } }
            .letter-embed {
                width: 100%;
                height: 100%;
                border: 0;
                background: transparent;
                display: block;
            }
            .letter-photo-frame {
                position: absolute;
                top: 50%;
                left: calc(100% + 24px);
                height: fit-content;
                width: max-content;
                transform: translateY(-50%);
                border: 15px solid transparent;
                border-image-source: url('100826/img-bd.png');
                border-image-slice: 80;
                border-image-width: 15px;
                border-image-repeat: stretch;
            }
            .letter-photo-frame[hidden] {
                display: none;
            }
            .letter-photo-frame img {
                display: block;
                max-height: 500px;
                max-width: 450px;
                height: auto;
                width: auto;
            }
            .bg-blur-overlay {
                position: fixed;
                inset: 0;
                backdrop-filter: blur(0px);
                -webkit-backdrop-filter: blur(0px);
                pointer-events: none;
                z-index: 0;
            }
        </style>
        <title>100826</title>
    </head>
    <body id="page-body">
        <div class="bg-blur-overlay" aria-hidden="true"></div>
        <div id="giftBox" class="giftbox">
            <div id="giftBoxInner" class="giftbox-inner">
                <img class="top" src="elements/giftbox100826/top.png" alt="" style="pointer-events: auto; user-select: none; cursor: pointer;">
                <img class="box" src="elements/giftbox100826/box.png" alt="" style="pointer-events: auto; user-select: none; cursor: pointer;">
            </div>
        </div>
        <img id="cover" class=""src="elements/transparent cover.png" alt="">
        <br><Br><br><br><br><br>
        <div id="mainTitle" class="maintitle" style="transform: translateX(260px);">
            <h1><span style="font-family:'Para'">15</span> Letters from<br><span style="font-family: 'Para'">15</span> people that love you</h1>
            <br><br><br>
            <p style="text-align: center">(Scroll Down)</p>
            <p style="text-align: center">Click the Flowers!</p>
        </div>
        <div id="main" class="" style="position: relative; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
            <div style="position: relative; display: inline-block; transform: translateY(0px) rotate(18deg) scale(0.92);">
                <div id="fl" class="fl" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; pointer-events: auto; transform: translateY(12px) translateX(8px) rotate(-1deg);">
                    <div id="flowerRow1" class="florwerrow1" style="position: absolute; top: 0px; left: 50%; transform: translateX(-50%); width: 720px; height: 170px; display: flex; align-items: flex-end; justify-content: center; gap: 42px;">
                        <img id="flowerItem1" class="flower-item" src="100826/von.png" alt="" style="width: 150px; transform: rotate(-24deg) translateY(120px); margin-right:10px; --pick-rot:-24deg;">
                        <img id="flowerItem2" class="flower-item" src="100826/chloe.png" alt="" style="width: 150px; transform: rotate(-10deg) translateY(65px); --pick-rot:-10deg;">
                        <img id="flowerItem3" class="flower-item" src="100826/yran.jpg" alt="" style="width: 150px; transform: rotate(0deg) translateY(45px); --pick-rot:0deg;">
                        <img id="flowerItem4" class="flower-item" src="100826/teo.png" alt="" style="width: 150px; transform: rotate(12deg) translateY(65px); --pick-rot:12deg;">
                        <img id="flowerItem5" class="flower-item" src="100826/leira.png" alt="" style="width: 150px; transform: rotate(24deg) translateY(120px); margin-left:10px; --pick-rot:24deg;">
                    </div>

                    <div id="flowerRow2" class="florwerrow2" style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%) translateY(20px); width: 620px; height: 140px; display: flex; align-items: flex-end; justify-content: center; gap: 22px;">
                        <img id="flowerItem6" class="flower-item" src="100826/rhian.jpg" alt="" style="width: 150px; transform: rotate(-24deg) translateY(50px); --pick-rot:-24deg;">
                        <img id="flowerItem7" class="flower-item" src="100826/liana.png" alt="" style="width: 150px; transform: rotate(-10deg) translateY(-5px); --pick-rot:-10deg;">
                        <img id="flowerItem8" class="flower-item" src="100826/jeann.png" alt="" style="width: 150px; transform: rotate(10deg) translateY(-5px); --pick-rot:10deg;">
                        <img id="flowerItem9" class="flower-item" src="100826/king.png" alt="" style="width: 150px; transform: rotate(24deg) translateY(50px); --pick-rot:24deg;">
                    </div>
                    
                    <div id="flowerRow3" class="florwerrow3" style="position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 500px; height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 60px;">
                        <img id="flowerItem10" class="flower-item" src="100826/dashien.jpg" alt="" style="width: 150px; transform: rotate(-18deg) translateY(40px); --pick-rot:-18deg;">
                        <img id="flowerItem11" class="flower-item" src="100826/adara.jpg" alt="" style="width: 150px; transform: rotate(0deg) translateY(-20px); --pick-rot:0deg;">
                        <img id="flowerItem12" class="flower-item" src="100826/micaela.jpg" alt="" style="width: 150px; transform: rotate(18deg) translateY(40px); --pick-rot:18deg;">
                    </div>

                    <div id="flowerRow4" class="florwerrow4" style="position: absolute; top: 315px; left: 50%; transform: translateX(-50%); width: 340px; height: 90px; display: flex; align-items: flex-end; justify-content: center; gap:40px;">
                        <img id="flowerItem13" class="flower-item" src="100826/debate.jpg" alt="" style="width: 150px; transform: rotate(-12deg) translateY(20px); --pick-rot:-12deg;">
                        <img id="flowerItem14" class="flower-item" src="100826/exni.jpg" alt="" style="width: 150px; transform: rotate(12deg) translateY(20px); --pick-rot:12deg;">
                    </div>

                    <div id="flowerRow5" class="florwerrow5" style="position: absolute; top: 390px; left: 50%; transform: translateX(-50%) translateY(85px); width: 180px; height: 80px; display: flex; align-items: flex-end; justify-content: center;">
                        <img id="flowerItem15" class="flower-item" src="100826/test.jpg" alt="" style="width: 150px; transform: rotate(0deg); --pick-rot:0deg;">
                    </div>
                </div>
                <img src="elements/100826boquet/base.png" alt="" style="position: relative; z-index: 3; display: block; width: 900px; height: auto; filter: drop-shadow(-14px 20px 25px rgba(0, 0, 0, 0.25));">
                <img src="elements/100826boquet/cover.png" alt="" style="position: absolute; top: 0; left: 0; z-index: 5; display: block; width: 900px; height: auto; pointer-events: none; filter: drop-shadow(-14px 20px 25px rgba(0, 0, 0, 0.25));">
            </div>
        </div>
        <!--mismong letter -->
        <div id="letterOverlay" class="letter-overlay" aria-hidden="true" style="z-index: 9">
            <button class="letter-back-button" id="letterBackButton" type="button" aria-label="Back">
                <img src="elements/back.svg" alt="Back" onerror="this.onerror=null;this.src='elements/back.png'">
            </button>
            <div class="letter-panel">
                <div id="letterBG" class="letter-bg">
                    <embed id="letterEmbed" class="letter-embed" src="" type="text/html" width="800" height="500" />
                </div>
                <div id="letterPhotoFrame" class="letter-photo-frame" hidden>
                    <img id="letterPhoto" alt="">
                </div>
                <img id="letterFlowerPreview" class="letter-flower-preview" src="" alt="">
            </div>
        </div>

        <script>
            let clickCount = 0;
            let activeLetterIndex = null;

            const clickBox = document.getElementById('giftBox');
            const giftboxBox = clickBox.querySelector('.box');
            const triggerCover = document.getElementById('cover');
            const triggerMain = document.getElementById('main');
            const mainTitle = document.getElementById('mainTitle');
            triggerMain.classList.add('flowers-locked');
            const letterOverlay = document.getElementById('letterOverlay');
            const letterEmbed = document.getElementById('letterEmbed');
            const letterPhotoFrame = document.getElementById('letterPhotoFrame');
            const letterPhoto = document.getElementById('letterPhoto');
            const letterFlowerPreview = document.getElementById('letterFlowerPreview');
            const letterBackButton = document.getElementById('letterBackButton');
            const flowerItems = document.querySelectorAll('.flower-item');
            const letterStorageKey = 'flowerStates';

            let flowerStates = JSON.parse(localStorage.getItem(letterStorageKey) || 'null');
            if (!Array.isArray(flowerStates) || flowerStates.length !== flowerItems.length) {
                flowerStates = Array(flowerItems.length).fill(0);
            }

            function saveFlowerStates() {
                localStorage.setItem(letterStorageKey, JSON.stringify(flowerStates));
            }

            function applyState(stateClass) {
                clickBox.classList.remove('state-one', 'state-two', 'state-three', 'is-open');
                void clickBox.offsetWidth;
                clickBox.classList.add(stateClass);
            }

            function openLetter(letterIndex) {
                const fallback = '100826/letters/letter-1.html';
                const letterFile = `100826/letters/letter-${letterIndex + 1}.html`;
                const finalSrc = flowerStates[letterIndex] === 1 ? letterFile : fallback;

                letterEmbed.addEventListener('error', () => {
                    letterEmbed.src = fallback;
                }, { once: true });

                letterEmbed.src = finalSrc;
                letterFlowerPreview.src = flowerItems[letterIndex].src;
                letterFlowerPreview.alt = `Flower ${letterIndex + 1}`;
                const flowerName = flowerItems[letterIndex].getAttribute('src').split('/').pop().replace(/\.[^.]+$/, '');
                letterPhotoFrame.hidden = true;
                letterPhoto.onload = () => { letterPhotoFrame.hidden = false; };
                letterPhoto.onerror = () => { letterPhotoFrame.hidden = true; };
                letterPhoto.src = `100826/photos/img-${flowerName}.jpg`;
                letterPhoto.alt = `${flowerName} photo`;
                flowerItems[letterIndex].classList.add('is-letter-open-hidden');
                letterOverlay.classList.add('visible');
                letterOverlay.setAttribute('aria-hidden', 'false');
                triggerMain.style.pointerEvents = 'none';
                activeLetterIndex = letterIndex;
            }

            function closeLetter() {
                if (activeLetterIndex !== null) {
                    flowerStates[activeLetterIndex] = 0;
                    saveFlowerStates();
                    flowerItems[activeLetterIndex].classList.remove('is-letter-open-hidden');
                }

                letterOverlay.classList.remove('visible');
                letterOverlay.setAttribute('aria-hidden', 'true');
                letterEmbed.src = '';
                letterPhoto.onload = null;
                letterPhoto.onerror = null;
                letterPhoto.removeAttribute('src');
                letterPhotoFrame.hidden = true;
                triggerMain.style.pointerEvents = 'auto';
                activeLetterIndex = null;
            }

            flowerItems.forEach((flower, index) => {
                flower.dataset.index = index;
                flower.dataset.state = String(flowerStates[index] || 0);

                const letterFile = `100826/letters/letter-${index + 1}.html`;
                flower.dataset.letter = letterFile;

                flower.addEventListener('click', () => {
                    if (triggerMain.classList.contains('flowers-locked')) return;

                    const facingAngle = parseFloat(getComputedStyle(flower).getPropertyValue('--pick-rot')) || 0;
                    const radians = facingAngle * Math.PI / 180;
                    const x = Math.sin(radians) * 170;
                    const y = -Math.cos(radians) * 170;
                    flower.style.setProperty('--pick-x', `${x}px`);
                    flower.style.setProperty('--pick-y', `${y}px`);

                    flowerStates[index] = 1;
                    saveFlowerStates();
                    flower.dataset.state = '1';
                    flower.classList.add('is-picked');
                    setTimeout(() => {
                        openLetter(index);
                    }, 300);
                    setTimeout(() => {
                        flower.classList.remove('is-picked');
                    }, 1000);
                });
            });

            letterBackButton.addEventListener('click', closeLetter);

            letterOverlay.addEventListener('click', (event) => {
                if (event.target === letterOverlay) {
                    closeLetter();
                }
            });

            clickBox.addEventListener('click', function() {
                if (clickBox.classList.contains('is-open') || clickCount >= 3) return;

                clickCount += 1;
                if (clickCount === 1) {
                    applyState('state-one');
                } else if (clickCount === 2) {
                    applyState('state-two');
                } else {
                    applyState('state-three');
                    triggerCover.classList.add('cover-open');
                    triggerMain.classList.add('main-open');
                    mainTitle.classList.add('main-open');

                    setTimeout(() => {
                        giftboxBox.addEventListener('animationend', () => {
                            triggerMain.classList.remove('flowers-locked');
                        }, { once: true });
                        clickBox.classList.add('is-open');
                    }, 180);
                }
            });
        </script>
    </body>
</html>
