<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="logo.ico">
        <link rel="stylesheet" href="styles.css">
        <title>100826</title>
        <style>
        @keyframes giftbox-hover {
            0%, 100% { transform: rotate(0deg) scale(1); }
            18% { transform: rotate(-3deg) scale(1.04); }
            36% { transform: rotate(4deg) scale(1.08); }
            54% { transform: rotate(-2.5deg) scale(1.06); }
            72% { transform: rotate(2deg) scale(1.04); }
            90% { transform: rotate(0deg) scale(1); }
        }
        @keyframes giftbox-open-top {
            0% { opacity: 1; transform: translateX(1.45px) scale(1.52); }
            15% { opacity: 1; transform: translateX(1.45px) scale(1.72); }
            45% { opacity: 1; transform: translateY(0) translateX(1.45px) scale(1.8); }
            72% { opacity: 1; transform: translateY(-100vh) translateX(1.45px) scale(1.8); }
            100% { opacity: 0; transform: translateY(-100vh) translateX(1.45px) scale(1.8); }
        }
        @keyframes giftbox-open-box {
            0% { opacity: 1; transform: scale(1.72); }
            15% { transform: scale(1.9); }
            45% { opacity: 1; transform: translateY(0) scale(1.9); }
            72% { opacity: 0; transform: translateY(0) scale(1.9); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.9); }
        }
        @keyframes giftbox-start {
            0% { transform: translate(-50%, calc(-50% - 100vh)); }
            100% { transform: translate(-50%, -50%); }
        }
        @keyframes main-open {
            0% { opacity: 0; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes cover-open {
            0% { transform: translateY(0); }
            100% { transform: translateY(-120vh); }
        }
        @keyframes state-one-top {
            0% { transform: scale(1); }
            100% { transform: scale(1.12) translateX(0.75px); }
        }
        @keyframes state-one-box {
            0% { transform: scale(1); }
            100% { transform: scale(1.24); }
        }
        @keyframes state-two-top {
            0% { transform: scale(1.12) translateX(2.2px); }
            100% { transform: scale(1.28); }
        }
        @keyframes state-two-box {
            0% { transform: scale(1.24); }
            100% { transform: scale(1.46); }
        }
        @keyframes state-three-top {
            0% { transform: scale(1.28) translateX(2.4px); }
            100% { transform: scale(1.52); }
        }
        @keyframes state-three-box {
            0% { transform: scale(1.46); }
            100% { transform: scale(1.72); }
        }
        .giftbox {
            position: fixed;
            top: 50%;
            left: 49%;
            width: 175px;
            height: 175px;
            animation: giftbox-start 1s ease-out forwards;
            user-select: none;
            transform-origin: center;
        }
        .giftbox-inner {
            position: relative;
            width: 175px;
            height: 175px;
            transform-origin: center;
            transition: transform 0.25s ease;
        }
        .giftbox img {
            position: absolute;
            width: 175px;
            height: 175px;
            transform-origin: center;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }
        .giftbox:hover .giftbox-inner {
            animation: giftbox-hover 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .giftbox.is-open .giftbox-inner {
            animation: none;
        }
        .giftbox.is-open:hover .giftbox-inner {
            animation: none;
        }
        .giftbox.is-open .top {
            animation: giftbox-open-top 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.05s;
        }
        .giftbox.is-open .box {
            animation: giftbox-open-box 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.05s;
        }
        .main-open {
            animation: main-open 5s forwards;
        }
        .cover-open {
            animation: cover-open 5s forwards;
            user-select: none;
        }
        .giftbox.state-one .top {
            animation: state-one-top 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .giftbox.state-one .box {
            animation: state-one-box 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .giftbox.state-two .top {
            animation: state-two-top 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .giftbox.state-two .box {
            animation: state-two-box 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .giftbox.state-three .top {
            animation: state-three-top 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .giftbox.state-three .box {
            animation: state-three-box 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        </style>
    </head>
    <body>
        <div class="bg-blur-overlay" aria-hidden="true"></div>
        <div id="giftBox" class="giftbox" style="z-index: 3;">
            <div id="giftBoxInner" class="giftbox-inner">
                <img class="top" src="elements/giftbox100826/top.png" alt="" style="transform: translateX(1px);">
                <img class="box" src="elements/giftbox100826/box.png" alt="">
            </div>
        </div>
        <img id="cover" class=""src="elements/transparent cover.png" alt="" style="position: fixed; width: 100%; height: 100%; z-index: 2;">
        <div id="main" style="opacity: 0; z-index: 1;" class="">
            <img src="elements/boquettest.jpg" alt="" style="width: 100%; height: 100%;">
        </div>
        <script>
            let clickCount = 0;
            const clickBox = document.getElementById('giftBox');
            const triggerCover = document.getElementById('cover');
            const triggerMain = document.getElementById('main');

            clickBox.addEventListener('click', function() {
                clickCount++;

                clickBox.classList.remove('state-one', 'state-two', 'state-three', 'is-open');

                if (clickCount === 4) {
                    clickBox.classList.add('is-open');
                    triggerCover.classList.add('cover-open');
                    triggerMain.classList.add('main-open');
                    clickCount = 0;
                    return;
                }

                const stateCycle = clickCount % 4;
                if (stateCycle === 1) {
                    clickBox.classList.add('state-one');
                } else if (stateCycle === 2) {
                    clickBox.classList.add('state-two');
                } else if (stateCycle === 3) {
                    clickBox.classList.add('state-three');
                }
            });
        </script>
    </body>
</html>
