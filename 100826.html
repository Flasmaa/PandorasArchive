<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="logo.ico">
        <link rel="stylesheet" href="styles.css">
        <title>100826</title>
        <style>
        @keyframes giftbox-hover {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        @keyframes giftbox-open-top {
            0% { transform: rotate(0deg); }
            8% { scale: 145%; }
            90% { scale: 145%; opacity: 1; }
            100% { scale: 145%; transform: translateY(-500px) rotate(0deg); }
        }
        @keyframes giftbox-open-box {
            0% { transform: rotate(0deg); }
            10% { scale: 160%; }
            90% { scale: 160%; opacity: 1; }
            100% { scale: 160%; opacity: 0; }
        }
        @keyframes giftbox-start {
            0% { transform: translate(-50%, calc(-50% - 100vh)); }
            100% { transform: translate(-50%, -50%); }
        }
        .giftbox {
            position: fixed;
            top: 50%;
            left: 49%;
            width: 175px;
            height: 175px;
            animation: giftbox-start 1s ease-out forwards;
        }
        .giftbox-inner {
            position: relative;
            width: 175px;
            height: 175px;
        }
        .giftbox img {
            position: absolute;
            width: 175px;
            height: 175px;
        }
        .giftbox .box {
            transform: translateX(-1px);
        }
        .giftbox:hover .giftbox-inner {
            animation: giftbox-hover 0.1s ease-in-out infinite;
        }
        .giftbox.is-open:hover .giftbox-inner {
            animation: none;
        }
        .giftbox.is-open .top {
            animation: giftbox-open-top 1.8s ease-in forwards;
        }
        .giftbox.is-open .box {
            animation: giftbox-open-box 2s ease-in-out forwards;
        }
        </style>
    </head>
    <body>
        <div class="bg-blur-overlay" aria-hidden="true"></div>
        <div class="giftbox">
            <div class="giftbox-inner">
                <img class="top" src="elements/giftbox100826/top.png" alt="">
                <img class="box" src="elements/giftbox100826/box.png" alt="">
            </div>
        </div>
        <script>
            document.querySelector('.giftbox').addEventListener('click', function() {
                this.classList.add('is-open');
            });
        </script>
    </body>
</html>
