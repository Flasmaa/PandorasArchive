<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="logo.ico">
        <link rel="stylesheet" href="styles.css">
        <title>100826</title>
        <style>
        @keyframes giftbox-hover {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        @keyframes giftbox-open-top {
            0% { transform: rotate(0deg) scale(1.4); opacity: 1; }
            10% { transform: translateX(1.45px) scale(1.65); }
            50% { opacity: 1; transform: translateY(0) translateX(1.45px) scale(1.65); }
            80% { transform: translateY(-100vh) translateX(1.45px) scale(1.65) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-100vh) translateX(1.45px) scale(1.65); }
        }
        @keyframes giftbox-open-box {
            0% { transform: rotate(0deg) scale(1.55); opacity: 1; }
            10% { transform: scale(1.8); }
            50% { opacity: 1; transform: translateY(0) scale(1.8); }
            80.5% { opacity: 0; transform: translateY(0) scale(1.8); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.8); }
        }
        @keyframes giftbox-start {
            0% { transform: translate(-50%, calc(-50% - 100vh)); }
            100% { transform: translate(-50%, -50%); }
        }
        @keyframes main-open {
            0% { opacity: 0; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes cover-open {
            0% { transform: translateY(0); }
            100% { transform: translateY(-120vh); }
        }
        @keyframes state-one-top {
            0% { transform: scale(1); }
            100% { transform: scale(1.10); }
        }
        @keyframes state-one-box {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
        @keyframes state-two-top {
            0% { transform: scale(1.1); }
            100% { transform: scale(1.25); }
        }
        @keyframes state-two-box {
            0% { transform: scale(1.2); }
            100% { transform: scale(1.40); }
        }
        @keyframes state-three-top {
            0% { transform: scale(1.25); }
            100% { transform: scale(1.45); }
        }
        @keyframes state-three-box {
            0% { transform: scale(1.40); }
            100% { transform: scale(1.65); }
        }
        .giftbox {
            position: fixed;
            top: 50%;
            left: 49%;
            width: 175px;
            height: 175px;
            animation: giftbox-start 1s ease-out forwards;
            user-select: none;
        }
        .giftbox-inner {
            position: relative;
            width: 175px;
            height: 175px;
        }
        .giftbox img {
            position: absolute;
            width: 175px;
            height: 175px;
        }
        .giftbox:hover .giftbox-inner {
            animation: giftbox-hover 0.2s ease-in-out infinite;
        }
        .giftbox.is-open:hover .giftbox-inner {
            animation: none;
        }
        .giftbox.is-open .top {
            animation: giftbox-open-top 3s ease forwards;
        }
        .giftbox.is-open .box {
            animation: giftbox-open-box 3s ease forwards;
        }
        .main-open {
            animation: main-open 5s forwards;
        }
        .cover-open {
            animation: cover-open 5s forwards;
            user-select: none;
        }
        .giftbox.state-one .top {
            animation: state-one-top 1s forwards;
        }
        .giftbox.state-one .box {
            animation: state-one-box 1s forwards;
        }
        .giftbox.state-two .top {
            animation: state-two-top 1s forwards;
        }
        .giftbox.state-two .box {
            animation: state-two-box 1s forwards;
        }
        .giftbox.state-three .top {
            animation: state-three-top 1s forwards;
        }
        .giftbox.state-three .box {
            animation: state-three-box 1s forwards;
        }
        </style>
    </head>
    <body>
        <div class="bg-blur-overlay" aria-hidden="true"></div>
        <div id="giftBox" class="giftbox" style="z-index: 3;">
            <div id="giftBoxInner" class="giftbox-inner">
                <img class="top" src="elements/giftbox100826/top.png" alt="" style="transform: translateX(1px);">
                <img class="box" src="elements/giftbox100826/box.png" alt="">
            </div>
        </div>
        <img id="cover" class=""src="elements/transparent cover.png" alt="" style="position: fixed; width: 100%; height: 100%; z-index: 2;">
        <div id="main" style="opacity: 0; z-index: 1;" class="">
            <img src="elements/boquettest.jpg" alt="" style="width: 100%; height: 100%;">
        </div>
        <script>
            let clickCount = 0;
            const clickBox = document.getElementById('giftBox');
            const triggerCover = document.getElementById('cover');
            const triggerMain = document.getElementById('main');

            clickBox.addEventListener('click', function() {
                clickCount++;

                clickBox.classList.remove('state-one', 'state-two', 'state-three', 'is-open');

                if (clickCount === 4) {
                    clickBox.classList.add('is-open');
                    triggerCover.classList.add('cover-open');
                    triggerMain.classList.add('main-open');
                    clickCount = 0;
                    return;
                }

                const stateCycle = clickCount % 4;
                if (stateCycle === 1) {
                    clickBox.classList.add('state-one');
                } else if (stateCycle === 2) {
                    clickBox.classList.add('state-two');
                } else if (stateCycle === 3) {
                    clickBox.classList.add('state-three');
                }
            });
        </script>
    </body>
</html>
