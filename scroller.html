<!DOCTYPE html>
<html>
    <head>
        <title>scroller</title>
        <style>
            .media-hover { position: relative; display: inline-block; }
            .media-hover img, .media-hover video { display: block; width: auto; height: 570px; max-width: 100%; }
            .media-row { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 12px; }
            .media-hover .hover-overlay {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-weight: 700;
                background: rgba(255, 183, 247, 0.542);
                opacity: 0;
                transition: opacity 160ms ease-in-out;
                user-select: none;
                pointer-events: none;
            }
            .media-hover:hover .hover-overlay { opacity: 1}
            .hover-overlay .label { padding: 6px 10px; border-radius: 4px; background: rgba(35, 93, 37, 0.716); font-family: 'Elegant Bloom', sans-serif; font-size: 20px; }
            .img:hover { transform: translateY(-4px) scale(1.03);}
            @font-face {
                font-family: 'Elegant Bloom';
                src: url('fonts/Elegant Bloom.otf') format('opentype');
                font-weight: normal;
                font-style: normal;
                }
        </style>
    </head>
